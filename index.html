<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀여운 캐릭터 채팅룸</title>
  <!-- P2P 친구 실시간 연동 라이브러리 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Gothic A1', 'Nanum Gothic', 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 50%, #4ade80 50%, #22c55e 100%);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-wrapper {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 950px;
    }

    /* ==========================================
       좌측 패널: 캐릭터 선택 (Character Selector)
       ========================================== */
    .left-panel {
      flex: 1.1;
      background: #ffffff;
      border: 3px solid #000;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      margin: 0 0 12px 0;
      color: #000;
    }

    /* 상단 미리보기 영역 */
    .preview-container {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .big-avatar-box {
      width: 110px;
      height: 110px;
      background: #e0f2fe;
      border: 3px solid #000;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .big-avatar-box svg, .big-avatar-box img {
      width: 90px;
      height: 90px;
      object-fit: cover;
    }

    .preview-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .input-label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .custom-input {
      width: 100%;
      padding: 8px 10px;
      border: 2px solid #000;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-blue {
      background: #2563eb;
      color: white;
      font-weight: bold;
      border: 2px solid #000;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.1s;
    }

    .btn-blue:active { transform: translate(1px, 1px); background: #1d4ed8; }

    .nav-btns {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-gray {
      flex: 1;
      background: #64748b;
      color: white;
      border: 2px solid #000;
      border-radius: 6px;
      padding: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 추가 기능 탭 (기본목록 / 직접그리기 / 사진업로드 / 친구연동) */
    .tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 2px;
      font-size: 0.75rem;
      font-weight: bold;
      background: #e2e8f0;
      border: 2px solid #000;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active { background: #fde047; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 캐릭터 그리드 */
    .grid-box {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #f0f9ff;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .grid-item {
      position: relative;
      background: #fff;
      border: 2px solid #000;
      border-radius: 10px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .grid-item.active {
      background: #bae6fd;
      border-width: 3px;
    }

    .grid-item svg, .grid-item img {
      width: 85%;
      height: 85%;
    }

    .grid-num {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      color: #000;
    }

    /* 캔버스 & P2P 연동 박스 */
    #drawCanvas {
      border: 2px solid #000;
      border-radius: 8px;
      background: #fff;
      cursor: crosshair;
      display: block;
      margin: 0 auto;
      touch-action: none;
    }

    .peer-box {
      background: #f8fafc;
      border: 2px solid #000;
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
    }

    /* ==========================================
       우측 패널: 채팅창 (Chat History)
       ========================================== */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-status-bar {
      background: #fff;
      border: 3px solid #000;
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-container {
      flex: 1;
      background: #fff;
      border: 3px solid #000;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
    }

    .chat-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin: 0 0 10px 0;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      height: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    /* 말풍선 UI */
    .chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .chat-msg.self {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 40px;
      height: 40px;
      background: #e0f2fe;
      border: 2px solid #000;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .msg-avatar svg, .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .msg-body {
      max-width: 75%;
    }

    .msg-user {
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .chat-msg.self .msg-user { text-align: right; }

    .msg-bubble {
      border: 2px solid #000;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      background: #e2e8f0;
      position: relative;
    }

    .chat-msg.other-1 .msg-bubble { background: #ffedd5; } /* 주황 말풍선 */
    .chat-msg.other-2 .msg-bubble { background: #fce7f3; } /* 분홍 말풍선 */
    .chat-msg.self .msg-bubble { background: #bae6fd; }    /* 파랑 말풍선 */

    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .main-wrapper { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <!-- 좌측: 캐릭터 선택 -->
  <div class="left-panel">
    <h2 class="panel-title">캐릭터 선택</h2>

    <!-- 상단 미리보기 & 이름 변경 -->
    <div class="preview-container">
      <div class="big-avatar-box" id="mainPreviewBox"></div>
      <div class="preview-controls">
        <div>
          <div class="input-label">캐릭터 이름</div>
          <input type="text" id="nameInput" class="custom-input" value="마시멜로">
        </div>
        <button class="btn-blue" onclick="saveName()">이름 저장</button>
      </div>
    </div>

    <!-- 이전/다음 버튼 -->
    <div class="nav-btns">
      <button class="btn-gray" onclick="navCharacter(-1)">이전</button>
      <button class="btn-blue" style="flex:1; padding:6px;" onclick="navCharacter(1)">다음</button>
    </div>

    <!-- 추가 기능 탭 -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('grid')">기본 캐릭터</button>
      <button class="tab-btn" onclick="setTab('draw')">직접 그리기</button>
      <button class="tab-btn" onclick="setTab('upload')">사진 업로드</button>
      <button class="tab-btn" onclick="setTab('peer')">친구 연동</button>
    </div>

    <!-- 1. 그리드 선택 -->
    <div id="tab-grid" class="tab-content active">
      <div class="grid-box" id="characterGrid"></div>
    </div>

    <!-- 2. 직접 그리기 -->
    <div id="tab-draw" class="tab-content">
      <canvas id="drawCanvas" width="130" height="130"></canvas>
      <div style="display:flex; gap:4px; margin-top:6px; justify-content:center;">
        <input type="color" id="penColor" value="#000000">
        <button class="btn-gray" onclick="clearCanvas()">지우기</button>
        <button class="btn-blue" style="padding:2px 8px; font-size:0.8rem;" onclick="applyDrawing()">적용</button>
      </div>
    </div>

    <!-- 3. 사진 업로드 -->
    <div id="tab-upload" class="tab-content">
      <input type="file" accept="image/*" class="custom-input" onchange="uploadImage(event)">
    </div>

    <!-- 4. 친구 연동 -->
    <div id="tab-peer" class="tab-content">
      <div class="peer-box">
        <div>내 접속 코드: <b id="myPeerId" style="color:#2563eb;">생성 중...</b></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <input type="text" id="friendIdInput" class="custom-input" placeholder="친구 코드 입력" style="padding:4px;">
          <button class="btn-blue" style="padding:4px 8px; font-size:0.8rem;" onclick="connectFriend()">연결</button>
        </div>
        <div id="connStatus" style="color:#16a34a; font-weight:bold; margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <!-- 우측: 실시간 채팅 -->
  <div class="right-panel">
    <div class="top-status-bar">
      선택된 캐릭터: <span id="topCharName">마시멜로</span>
    </div>

    <div class="chat-container">
      <h3 class="chat-title">실시간 채팅</h3>
      
      <div class="chat-list" id="chatList">
        <!-- 손그림 스타일 샘플 채팅 -->
        <div class="chat-msg">
          <div class="msg-avatar" id="samplePanda"></div>
          <div class="msg-body">
            <div class="msg-user">탐험가_01</div>
            <div class="msg-bubble">안녕하세요! 캐릭터가 너무 동글동글 귀여워요!</div>
          </div>
        </div>

        <div class="chat-msg other-1" style="flex-direction:row-reverse;">
          <div class="msg-avatar" id="sampleFox"></div>
          <div class="msg-body" style="align-items:flex-end;">
            <div class="msg-user" style="text-align:right;">여우친구</div>
            <div class="msg-bubble">토끼 캐릭터 마음에 드시나요? 총 30가지가 있어요!</div>
          </div>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" class="custom-input" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button class="btn-blue" style="width:70px;" onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 이미지 속 동글동글 손그림 느낌을 살린 SVG 캐릭터 데이터
  const SVG_LIST = [
    // 1. 흰 토끼 (마시멜로)
    `<svg viewBox="0 0 100 100"><ellipse cx="38" cy="22" rx="8" ry="18" fill="#fff" stroke="#1e293b" stroke-width="4"/><ellipse cx="62" cy="22" rx="8" ry="18" fill="#fff" stroke="#1e293b" stroke-width="4"/><path d="M 22,58 C 20,38 80,38 78,58 C 80,78 20,78 22,58 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/><circle cx="40" cy="54" r="3.5" fill="#1e293b"/><circle cx="60" cy="54" r="3.5" fill="#1e293b"/><path d="M 45 62 Q 50 67 55 62" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="32" cy="58" r="4.5" fill="#f472b6"/><circle cx="68" cy="58" r="4.5" fill="#f472b6"/></svg>`,
    // 2. 팬더
    `<svg viewBox="0 0 100 100"><circle cx="28" cy="32" r="10" fill="#1e293b"/><circle cx="72" cy="32" r="10" fill="#1e293b"/><path d="M 20,58 C 18,38 82,38 80,58 C 82,80 18,80 20,58 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/><ellipse cx="38" cy="52" rx="7" ry="9" fill="#1e293b"/><ellipse cx="62" cy="52" rx="7" ry="9" fill="#1e293b"/><ellipse cx="38" cy="51" rx="2" ry="3" fill="#fff"/><ellipse cx="62" cy="51" rx="2" ry="3" fill="#fff"/><path d="M 46 63 Q 50 66 54 63" stroke="#1e293b" stroke-width="3" fill="none"/></svg>`,
    // 3. 햄스터
    `<svg viewBox="0 0 100 100"><path d="M 20,58 C 18,35 82,35 80,58 C 82,80 18,80 20,58 Z" fill="#f97316" stroke="#1e293b" stroke-width="4"/><path d="M 30,62 C 28,45 72,45 70,62 C 72,78 28,78 30,62 Z" fill="#ffedd5"/><circle cx="40" cy="52" r="3.5" fill="#1e293b"/><circle cx="60" cy="52" r="3.5" fill="#1e293b"/><path d="M 46 60 Q 50 64 54 60" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="32" cy="58" r="5" fill="#fca5a5"/><circle cx="68" cy="58" r="5" fill="#fca5a5"/></svg>`,
    // 4. 차 마시는 흑곰
    `<svg viewBox="0 0 100 100"><circle cx="28" cy="30" r="9" fill="#334155" stroke="#1e293b" stroke-width="3"/><circle cx="72" cy="30" r="9" fill="#334155" stroke="#1e293b" stroke-width="3"/><path d="M 20,58 C 18,36 82,36 80,58 C 82,80 18,80 20,58 Z" fill="#334155" stroke="#1e293b" stroke-width="4"/><ellipse cx="50" cy="62" rx="14" ry="10" fill="#f8fafc"/><circle cx="40" cy="50" r="3" fill="#1e293b"/><circle cx="60" cy="50" r="3" fill="#1e293b"/><ellipse cx="50" cy="58" rx="4" ry="3" fill="#1e293b"/><circle cx="32" cy="56" r="4.5" fill="#f43f5e"/><circle cx="68" cy="56" r="4.5" fill="#f43f5e"/><rect x="58" y="66" width="14" height="10" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/></svg>`,
    // 5. 강아지
    `<svg viewBox="0 0 100 100"><ellipse cx="20" cy="52" rx="9" ry="16" fill="#fbbf24" stroke="#1e293b" stroke-width="4"/><ellipse cx="80" cy="52" rx="9" ry="16" fill="#fbbf24" stroke="#1e293b" stroke-width="4"/><path d="M 22,58 C 20,38 80,38 78,58 C 80,78 20,78 22,58 Z" fill="#fef08a" stroke="#1e293b" stroke-width="4"/><circle cx="40" cy="52" r="3.5" fill="#1e293b"/><circle cx="60" cy="52" r="3.5" fill="#1e293b"/><ellipse cx="50" cy="58" rx="5" ry="4" fill="#1e293b"/></svg>`,
    // 6. 여우
    `<svg viewBox="0 0 100 100"><polygon points="22,25 38,45 15,45" fill="#ea580c" stroke="#1e293b" stroke-width="3"/><polygon points="78,25 62,45 85,45" fill="#ea580c" stroke="#1e293b" stroke-width="3"/><path d="M 20,58 C 18,38 82,38 80,58 C 82,80 18,80 20,58 Z" fill="#ea580c" stroke="#1e293b" stroke-width="4"/><polygon points="50,75 38,55 62,55" fill="#fff"/></svg>`,
    // 7. 사과곰
    `<svg viewBox="0 0 100 100"><path d="M 20,58 C 18,35 82,35 80,58 C 82,80 18,80 20,58 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4"/><path d="M 50 18 Q 55 10 60 14" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="40" cy="52" r="3.5" fill="#1e293b"/><circle cx="60" cy="52" r="3.5" fill="#1e293b"/><path d="M 45 61 Q 50 65 55 61" stroke="#1e293b" stroke-width="3" fill="none"/></svg>`,
    // 8. 젖소
    `<svg viewBox="0 0 100 100"><path d="M 20,58 C 18,38 82,38 80,58 C 82,80 18,80 20,58 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/><path d="M 28 42 Q 38 35 45 48 Z" fill="#1e293b"/><ellipse cx="50" cy="62" rx="11" ry="7" fill="#fbcfe8" stroke="#1e293b" stroke-width="2"/></svg>`
  ];

  let currentIndex = 0;
  let currentAvatar = { type: 'svg', data: SVG_LIST[0] };
  let charName = "마시멜로";
  let peer = null, conn = null;

  // 1. 초기화
  window.onload = () => {
    renderGrid();
    selectCharacter(0);
    initCanvas();
    initPeer();

    // 샘플 메시지 캐릭터 설정
    document.getElementById('samplePanda').innerHTML = SVG_LIST[1];
    document.getElementById('sampleFox').innerHTML = SVG_LIST[5];
  };

  // 2. 그리드 생성 (30개 셀)
  function renderGrid() {
    const grid = document.getElementById('characterGrid');
    grid.innerHTML = '';
    
    for (let i = 0; i < 30; i++) {
      const svgData = SVG_LIST[i % SVG_LIST.length];
      const item = document.createElement('div');
      item.className = `grid-item ${i === currentIndex ? 'active' : ''}`;
      item.onclick = () => selectCharacter(i);
      item.innerHTML = `<span class="grid-num">${i + 1}</span>${svgData}`;
      grid.appendChild(item);
    }
  }

  function selectCharacter(index) {
    currentIndex = index;
    currentAvatar = { type: 'svg', data: SVG_LIST[index % SVG_LIST.length] };
    
    document.querySelectorAll('.grid-item').forEach((el, idx) => {
      el.classList.toggle('active', idx === index);
    });

    updatePreview();
  }

  function navCharacter(dir) {
    let next = currentIndex + dir;
    if (next < 0) next = 29;
    if (next > 29) next = 0;
    selectCharacter(next);
  }

  function updatePreview() {
    const box = document.getElementById('mainPreviewBox');
    if (currentAvatar.type === 'svg') {
      box.innerHTML = currentAvatar.data;
    } else {
      box.innerHTML = `<img src="${currentAvatar.data}">`;
    }
  }

  function saveName() {
    const val = document.getElementById('nameInput').value.trim();
    if (val) {
      charName = val;
      document.getElementById('topCharName').innerText = charName;
    }
  }

  // 3. 탭 전환
  function setTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  // 4. 직접 그리기 (Canvas)
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = document.getElementById('penColor').value;
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  }

  function clearCanvas() { ctx.fillRect(0, 0, canvas.width, canvas.height); }

  function applyDrawing() {
    currentAvatar = { type: 'img', data: canvas.toDataURL() };
    updatePreview();
  }

  // 5. 사진 업로드
  function uploadImage(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        currentAvatar = { type: 'img', data: evt.target.result };
        updatePreview();
      };
      reader.readAsDataURL(file);
    }
  }

  // 6. 친구 실시간 연동 (PeerJS)
  function initPeer() {
    peer = new Peer();
    peer.on('open', id => document.getElementById('myPeerId').innerText = id);
    peer.on('connection', c => { conn = c; listenChat(); });
  }

  function connectFriend() {
    const friendId = document.getElementById('friendIdInput').value.trim();
    if (!friendId) return;
    conn = peer.connect(friendId);
    listenChat();
  }

  function listenChat() {
    conn.on('open', () => document.getElementById('connStatus').innerText = "🟢 연결 성공!");
    conn.on('data', data => addMessage(data.user, data.avatar, data.text, false));
  }

  // 7. 채팅 메시지 전송
  function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(charName, currentAvatar, text, true);

    if (conn && conn.open) {
      conn.send({ user: charName, avatar: currentAvatar, text: text });
    }

    input.value = '';
  }

  function addMessage(user, avatar, text, isSelf) {
    const list = document.getElementById('chatList');
    const msg = document.createElement('div');
    msg.className = `chat-msg ${isSelf ? 'self' : 'other-1'}`;

    const avatarHtml = avatar.type === 'svg' ? avatar.data : `<img src="${avatar.data}">`;

    msg.innerHTML = `
      <div class="msg-avatar">${avatarHtml}</div>
      <div class="msg-body">
        <div class="msg-user">${user}</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      </div>
    `;

    list.appendChild(msg);
    list.scrollTop = list.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
</script>

</body>
</html>
