<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 멀티 커스텀 채팅룸</title>
  <!-- 무료 실시간 통신 라이브러리 (MQTT) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: 'Gothic A1', 'Nanum Gothic', sans-serif; }
    
    body {
      background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 50%, #4ade80 50%, #22c55e 100%);
      margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    
    .main-wrapper { 
      display: flex; gap: 16px; width: 100%; max-width: 980px; height: 680px; /* 전체 높이 고정 */
    }
    
    /* 좌측 패널 */
    .left-panel {
      flex: 1.2; background: #fff; border: 3px solid #000; border-radius: 16px; padding: 16px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow-y: auto;
    }
    .panel-title { font-size: 1.4rem; font-weight: 800; text-align: center; margin: 0 0 12px 0; }
    
    .preview-container { display: flex; gap: 12px; margin-bottom: 12px; }
    .big-avatar-box {
      width: 110px; height: 110px; background: #e0f2fe; border: 3px solid #000;
      border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    }
    .big-avatar-box svg, .big-avatar-box img { width: 90px; height: 90px; object-fit: cover; }
    
    .preview-controls { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .input-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .custom-input { width: 100%; padding: 8px 10px; border: 2px solid #000; border-radius: 8px; font-size: 0.95rem; outline: none; }
    
    .btn-blue {
      background: #2563eb; color: white; font-weight: bold; border: 2px solid #000;
      border-radius: 8px; padding: 8px; cursor: pointer; font-size: 0.9rem; text-align: center;
    }
    .btn-gray {
      background: #64748b; color: white; border: 2px solid #000;
      border-radius: 6px; padding: 6px; font-weight: bold; cursor: pointer;
    }
    
    .tab-bar { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab-btn {
      flex: 1; padding: 6px 2px; font-size: 0.75rem; font-weight: bold;
      background: #e2e8f0; border: 2px solid #000; border-radius: 6px; cursor: pointer;
    }
    .tab-btn.active { background: #fde047; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .custom-select-group { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
    .custom-row { display: flex; align-items: center; justify-content: space-between; background: #f1f5f9; padding: 6px 10px; border: 2px solid #000; border-radius: 8px; }
    .custom-row label { font-size: 0.85rem; font-weight: bold; }
    .custom-row select { padding: 4px; border: 2px solid #000; border-radius: 6px; font-weight: bold; }

    .grid-box {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
      background: #f0f9ff; border: 2px solid #000; border-radius: 12px; padding: 8px; max-height: 180px; overflow-y: auto;
    }
    .grid-item {
      position: relative; background: #fff; border: 2px solid #000; border-radius: 10px;
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .grid-item.active { background: #bae6fd; border-width: 3px; }
    .grid-item svg { width: 85%; height: 85%; }

    #drawCanvas { border: 2px solid #000; border-radius: 8px; background: #fff; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }
    
    .room-box { background: #f8fafc; border: 2px solid #000; border-radius: 8px; padding: 10px; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }

    /* 우측 채팅 패널 - 화면에 보이는 만큼만 고정 */
    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .top-status-bar { background: #fff; border: 3px solid #000; border-radius: 10px; padding: 8px 12px; font-weight: bold; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .status-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }

    .chat-container { 
      flex: 1; background: #fff; border: 3px solid #000; border-radius: 12px; padding: 12px; 
      display: flex; flex-direction: column; min-height: 0; /* 스크롤 고정 핵심 구문 */
    }
    .chat-title { font-size: 1.2rem; font-weight: 800; margin: 0 0 10px 0; flex-shrink: 0; }
    
    /* ⭐ 채팅 스크롤 영역 핵심 설정 ⭐ */
    .chat-list { 
      flex: 1; 
      overflow-y: auto; /* 넘치면 스크롤바 생성 */
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      padding-right: 6px; 
      min-height: 0; 
    }

    /* 커스텀 스크롤바 예쁘게 */
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    .chat-list::-webkit-scrollbar-track { background: #f1f5f9; }

    .chat-msg { display: flex; align-items: flex-start; gap: 8px; }
    .chat-msg.self { flex-direction: row-reverse; }
    
    .msg-avatar {
      width: 42px; height: 42px; background: #e0f2fe; border: 2px solid #000;
      border-radius: 10px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .msg-avatar svg, .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-body { max-width: 75%; }
    .msg-user { font-size: 0.8rem; font-weight: bold; margin-bottom: 2px; }
    .chat-msg.self .msg-user { text-align: right; }
    
    .msg-bubble { border: 2px solid #000; border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; background: #ffedd5; word-break: break-all; }
    .chat-msg.self .msg-bubble { background: #bae6fd; }
    
    .chat-input-row { display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0; }

    @media (max-width: 768px) { 
      .main-wrapper { flex-direction: column; height: auto; } 
      .right-panel { height: 500px; }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <!-- 좌측: 캐릭터 선택 & 방 접속 -->
  <div class="left-panel">
    <h2 class="panel-title">캐릭터 커스텀</h2>

    <!-- 미리보기 및 이름 -->
    <div class="preview-container">
      <div class="big-avatar-box" id="mainPreviewBox"></div>
      <div class="preview-controls">
        <div>
          <div class="input-label">캐릭터 이름</div>
          <input type="text" id="nameInput" class="custom-input" value="익명">
        </div>
        <button class="btn-blue" onclick="saveName()">이름 적용</button>
      </div>
    </div>

    <!-- 탭 선택 -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('custom')">옷/장신구</button>
      <button class="tab-btn" onclick="setTab('grid')">기본 베이스</button>
      <button class="tab-btn" onclick="setTab('draw')">직접 그리기</button>
      <button class="tab-btn" onclick="setTab('upload')">사진 업로드</button>
    </div>

    <!-- 1. 커스텀 탭 -->
    <div id="tab-custom" class="tab-content active">
      <div class="custom-select-group">
        <div class="custom-row">
          <label>😊 표정</label>
          <select id="selFace" onchange="updateCustomAvatar()">
            <option value="smile">웃음</option>
            <option value="wink">윙크</option>
            <option value="excited">신남 (^o^)</option>
            <option value="blank">멍함 (._.)</option>
          </select>
        </div>
        <div class="custom-row">
          <label>🎩 모자</label>
          <select id="selHat" onchange="updateCustomAvatar()">
            <option value="none">없음</option>
            <option value="party">고깔모자</option>
            <option value="ribbon">빨간 리본</option>
            <option value="wizard">마법사 모자</option>
            <option value="crown">왕관</option>
          </select>
        </div>
        <div class="custom-row">
          <label>👕 옷</label>
          <select id="selClothes" onchange="updateCustomAvatar()">
            <option value="none">없음</option>
            <option value="overalls">멜빵바지</option>
            <option value="shirt">카라 셔츠</option>
            <option value="sailor">세일러 복</option>
          </select>
        </div>
        <div class="custom-row">
          <label>👓 장신구</label>
          <select id="selAcc" onchange="updateCustomAvatar()">
            <option value="none">없음</option>
            <option value="glasses">안경</option>
            <option value="sunglass">선글라스</option>
            <option value="blush">볼터치</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 2. 기본 동물 베이스 그리드 -->
    <div id="tab-grid" class="tab-content">
      <div class="grid-box" id="characterGrid"></div>
    </div>

    <!-- 3. 직접 그리기 -->
    <div id="tab-draw" class="tab-content">
      <canvas id="drawCanvas" width="130" height="130"></canvas>
      <div style="display:flex; gap:4px; margin-top:6px; justify-content:center;">
        <input type="color" id="penColor" value="#000000">
        <button class="btn-gray" onclick="clearCanvas()">지우기</button>
        <button class="btn-blue" style="padding:2px 8px; font-size:0.8rem;" onclick="applyDrawing()">적용</button>
      </div>
    </div>

    <!-- 4. 사진 업로드 -->
    <div id="tab-upload" class="tab-content">
      <input type="file" accept="image/*" class="custom-input" onchange="uploadImage(event)">
    </div>

    <!-- 방 접속 & 비밀번호 설정 -->
    <div style="margin-top:auto; padding-top:10px;">
      <div class="room-box">
        <div style="display:flex; gap:6px;">
          <div style="flex:1;">
            <div class="input-label">🔑 방 번호</div>
            <input type="number" id="roomInput" class="custom-input" placeholder="예: 1234" value="1234">
          </div>
          <div style="flex:1;">
            <div class="input-label">🔒 비밀번호</div>
            <input type="password" id="pwInput" class="custom-input" placeholder="비밀번호" value="0000">
          </div>
        </div>
        <button class="btn-blue" style="width:100%; margin-top:4px;" onclick="joinRoom()">방 입장하기</button>
      </div>
    </div>
  </div>

  <!-- 우측: 실시간 채팅창 (스크롤 적용) -->
  <div class="right-panel">
    <div class="top-status-bar">
      <span>현재 방: <b id="currentRoomText" style="color:#2563eb;">1234번 방</b></span>
      <span class="status-badge" id="connBadge">서버 연결 중...</span>
    </div>

    <div class="chat-container">
      <h3 class="chat-title">실시간 채팅</h3>
      
      <!-- 스크롤 처리되는 채팅 리스트 영역 -->
      <div class="chat-list" id="chatList"></div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" class="custom-input" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button class="btn-blue" style="width:70px;" onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 실시간 MQTT 서버
  const mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
  const myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
  let currentTopic = "";

  const BASE_ANIMALS = [
    { name: "토끼", body: `<ellipse cx="38" cy="18" rx="7" ry="16" fill="#fff" stroke="#000" stroke-width="3"/><ellipse cx="62" cy="18" rx="7" ry="16" fill="#fff" stroke="#000" stroke-width="3"/><path d="M 22,58 C 20,38 80,38 78,58 C 80,78 20,78 22,58 Z" fill="#fff" stroke="#000" stroke-width="4"/>` },
    { name: "곰", body: `<circle cx="28" cy="30" r="9" fill="#334155" stroke="#000" stroke-width="3"/><circle cx="72" cy="30" r="9" fill="#334155" stroke="#000" stroke-width="3"/><path d="M 20,58 C 18,36 82,36 80,58 C 82,80 18,80 20,58 Z" fill="#334155" stroke="#000" stroke-width="4"/><ellipse cx="50" cy="62" rx="14" ry="10" fill="#f8fafc"/>` },
    { name: "햄스터", body: `<path d="M 20,58 C 18,35 82,35 80,58 C 82,80 18,80 20,58 Z" fill="#f97316" stroke="#000" stroke-width="4"/><path d="M 30,62 C 28,45 72,45 70,62 C 72,78 28,78 30,62 Z" fill="#ffedd5"/>` },
    { name: "강아지", body: `<ellipse cx="20" cy="52" rx="9" ry="16" fill="#fbbf24" stroke="#000" stroke-width="3"/><ellipse cx="80" cy="52" rx="9" ry="16" fill="#fbbf24" stroke="#000" stroke-width="3"/><path d="M 22,58 C 20,38 80,38 78,58 C 80,78 20,78 22,58 Z" fill="#fef08a" stroke="#000" stroke-width="4"/>` },
    { name: "고양이", body: `<polygon points="22,25 38,45 15,45" fill="#94a3b8" stroke="#000" stroke-width="3"/><polygon points="78,25 62,45 85,45" fill="#94a3b8" stroke="#000" stroke-width="3"/><path d="M 20,58 C 18,38 82,38 78,58 C 80,78 20,78 22,58 Z" fill="#94a3b8" stroke="#000" stroke-width="4"/>` }
  ];

  const FACES = {
    smile: `<circle cx="40" cy="52" r="3.5" fill="#000"/><circle cx="60" cy="52" r="3.5" fill="#000"/><path d="M 45 61 Q 50 66 55 61" stroke="#000" stroke-width="3" fill="none"/>`,
    wink: `<path d="M 35 52 L 45 52" stroke="#000" stroke-width="3"/><circle cx="60" cy="52" r="3.5" fill="#000"/><path d="M 45 61 Q 50 66 55 61" stroke="#000" stroke-width="3" fill="none"/>`,
    excited: `<path d="M 35 54 L 40 48 L 45 54" stroke="#000" stroke-width="3" fill="none"/><path d="M 55 54 L 60 48 L 65 54" stroke="#000" stroke-width="3" fill="none"/><ellipse cx="50" cy="62" rx="4" ry="6" fill="#000"/>`,
    blank: `<circle cx="40" cy="52" r="3.5" fill="#000"/><circle cx="60" cy="52" r="3.5" fill="#000"/><path d="M 44 62 L 56 62" stroke="#000" stroke-width="3"/>`
  };

  const HATS = {
    none: ``,
    party: `<polygon points="50,10 38,35 62,35" fill="#ef4444" stroke="#000" stroke-width="2"/><circle cx="50" cy="8" r="4" fill="#fde047"/>`,
    ribbon: `<path d="M 40 25 Q 50 30 60 25 Q 65 20 55 18 Q 50 25 45 18 Q 35 20 40 25 Z" fill="#dc2626" stroke="#000" stroke-width="2"/>`,
    wizard: `<path d="M 50 5 L 30 35 L 70 35 Z" fill="#7c3aed" stroke="#000" stroke-width="2"/><ellipse cx="50" cy="35" rx="25" ry="5" fill="#6d28d9" stroke="#000" stroke-width="2"/>`,
    crown: `<polygon points="35,35 35,20 42,28 50,15 58,28 65,20 65,35" fill="#eab308" stroke="#000" stroke-width="2"/>`
  };

  const CLOTHES = {
    none: ``,
    overalls: `<path d="M 32,68 L 68,68 L 68,78 L 32,78 Z" fill="#2563eb" stroke="#000" stroke-width="2"/><line x1="36" y1="58" x2="36" y2="68" stroke="#000" stroke-width="3"/><line x1="64" y1="58" x2="64" y2="68" stroke="#000" stroke-width="3"/>`,
    shirt: `<path d="M 32,62 L 50,70 L 68,62 L 68,78 L 32,78 Z" fill="#fff" stroke="#000" stroke-width="2"/><polygon points="40,62 50,68 60,62" fill="#ef4444"/>`,
    sailor: `<path d="M 30,62 L 70,62 L 70,78 L 30,78 Z" fill="#0284c7" stroke="#000" stroke-width="2"/><polygon points="42,62 50,72 58,62" fill="#fff"/>`
  };

  const ACCESSORIES = {
    none: ``,
    glasses: `<circle cx="40" cy="52" r="8" fill="none" stroke="#000" stroke-width="2"/><circle cx="60" cy="52" r="8" fill="none" stroke="#000" stroke-width="2"/><line x1="48" y1="52" x2="52" y2="52" stroke="#000" stroke-width="2"/>`,
    sunglass: `<rect x="30" y="46" width="18" height="12" rx="2" fill="#000"/><rect x="52" y="46" width="18" height="12" rx="2" fill="#000"/><line x1="48" y1="50" x2="52" y2="50" stroke="#000" stroke-width="2"/>`,
    blush: `<ellipse cx="32" cy="58" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/><ellipse cx="68" cy="58" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>`
  };

  let selectedBaseIdx = 0;
  let currentAvatar = { type: 'svg' };
  let myName = "유저_" + Math.floor(10 + Math.random() * 90);

  window.onload = () => {
    selectedBaseIdx = Math.floor(Math.random() * BASE_ANIMALS.length);
    document.getElementById('nameInput').value = myName;

    renderBaseGrid();
    updateCustomAvatar();
    initCanvas();
  };

  mqttClient.on('connect', () => {
    document.getElementById('connBadge').innerText = "🟢 실시간 연결됨";
    joinRoom();
  });

  mqttClient.on('message', (topic, message) => {
    try {
      const data = JSON.parse(message.toString());
      renderMessage(data.user, data.avatar, data.text, data.senderId === myClientId);
    } catch(e) { console.error(e); }
  });

  function joinRoom() {
    const roomNum = document.getElementById('roomInput').value.trim();
    const roomPw = document.getElementById('pwInput').value.trim();

    if (!roomNum || !roomPw) return alert("방 번호와 비밀번호를 모두 입력하세요!");

    if (currentTopic) mqttClient.unsubscribe(currentTopic);

    currentTopic = `cute_chat_room_${roomNum}_pw_${roomPw}`;
    mqttClient.subscribe(currentTopic);

    document.getElementById('currentRoomText').innerText = `${roomNum}번 방`;
    document.getElementById('chatList').innerHTML = `<div style="text-align:center; color:#64748b; font-size:0.85rem; padding:8px; font-weight:bold;">🔑 ${roomNum}번 방에 입장했습니다.</div>`;
  }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    const payload = {
      senderId: myClientId,
      user: myName,
      avatar: currentAvatar,
      text: text
    };

    mqttClient.publish(currentTopic, JSON.stringify(payload));
    input.value = '';
  }

  function renderMessage(user, avatar, text, isSelf) {
    const list = document.getElementById('chatList');
    const msg = document.createElement('div');
    msg.className = `chat-msg ${isSelf ? 'self' : ''}`;
    
    const avatarHtml = avatar.type === 'svg' ? avatar.data : `<img src="${avatar.data}">`;

    msg.innerHTML = `
      <div class="msg-avatar">${avatarHtml}</div>
      <div class="msg-body">
        <div class="msg-user">${escapeHtml(user)}</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      </div>
    `;
    list.appendChild(msg);
    // 새 메시지가 오면 항상 맨 아래 스크롤로 이동
    list.scrollTop = list.scrollHeight;
  }

  function updateCustomAvatar() {
    const base = BASE_ANIMALS[selectedBaseIdx].body;
    const face = FACES[document.getElementById('selFace').value];
    const hat = HATS[document.getElementById('selHat').value];
    const clothes = CLOTHES[document.getElementById('selClothes').value];
    const acc = ACCESSORIES[document.getElementById('selAcc').value];

    const fullSvg = `<svg viewBox="0 0 100 100">${base}${face}${clothes}${acc}${hat}</svg>`;
    currentAvatar = { type: 'svg', data: fullSvg };
    updatePreview();
  }

  function renderBaseGrid() {
    const grid = document.getElementById('characterGrid');
    grid.innerHTML = '';
    BASE_ANIMALS.forEach((anim, idx) => {
      const item = document.createElement('div');
      item.className = `grid-item ${idx === selectedBaseIdx ? 'active' : ''}`;
      item.onclick = () => {
        selectedBaseIdx = idx;
        renderBaseGrid();
        updateCustomAvatar();
      };
      item.innerHTML = `<svg viewBox="0 0 100 100">${anim.body}${FACES.smile}</svg>`;
      grid.appendChild(item);
    });
  }

  function updatePreview() {
    const box = document.getElementById('mainPreviewBox');
    if (currentAvatar.type === 'svg') {
      box.innerHTML = currentAvatar.data;
    } else {
      box.innerHTML = `<img src="${currentAvatar.data}">`;
    }
  }

  function saveName() {
    const val = document.getElementById('nameInput').value.trim();
    if (val) myName = val;
  }

  function setTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = document.getElementById('penColor').value;
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke(); ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  }

  function clearCanvas() { ctx.fillRect(0, 0, canvas.width, canvas.height); }
  function applyDrawing() { currentAvatar = { type: 'img', data: canvas.toDataURL() }; updatePreview(); }

  function uploadImage(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => { currentAvatar = { type: 'img', data: evt.target.result }; updatePreview(); };
      reader.readAsDataURL(file);
    }
  }

  function escapeHtml(str) { return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
</script>

</body>
