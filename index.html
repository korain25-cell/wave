<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>귀여운 캐릭터 채팅룸</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Gothic A1', 'Nanum Gothic', sans-serif; }
    body {
      background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 50%, #4ade80 50%, #22c55e 100%);
      margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .main-wrapper { display: flex; gap: 16px; width: 100%; max-width: 950px; }
    
    .left-panel {
      flex: 1.1; background: #fff; border: 3px solid #000; border-radius: 16px; padding: 16px;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.15); display: flex; flex-direction: column;
    }
    .panel-title { font-size: 1.4rem; font-weight: 800; text-align: center; margin: 0 0 12px 0; }
    
    .preview-container { display: flex; gap: 12px; margin-bottom: 12px; }
    .big-avatar-box {
      width: 110px; height: 110px; background: #e0f2fe; border: 3px solid #000;
      border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
    }
    .big-avatar-box svg, .big-avatar-box img { width: 90px; height: 90px; object-fit: cover; }
    
    .preview-controls { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .input-label { font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .custom-input { width: 100%; padding: 8px 10px; border: 2px solid #000; border-radius: 8px; font-size: 0.95rem; outline: none; }
    
    .btn-blue {
      background: #2563eb; color: white; font-weight: bold; border: 2px solid #000;
      border-radius: 8px; padding: 10px; cursor: pointer; font-size: 0.95rem; text-align: center;
    }
    .btn-gray {
      flex: 1; background: #64748b; color: white; border: 2px solid #000;
      border-radius: 6px; padding: 6px; font-weight: bold; cursor: pointer;
    }
    
    .nav-btns { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab-btn {
      flex: 1; padding: 6px 2px; font-size: 0.75rem; font-weight: bold;
      background: #e2e8f0; border: 2px solid #000; border-radius: 6px; cursor: pointer;
    }
    .tab-btn.active { background: #fde047; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .grid-box {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
      background: #f0f9ff; border: 2px solid #000; border-radius: 12px; padding: 8px; max-height: 240px; overflow-y: auto;
    }
    .grid-item {
      position: relative; background: #fff; border: 2px solid #000; border-radius: 10px;
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .grid-item.active { background: #bae6fd; border-width: 3px; }
    .grid-item svg, .grid-item img { width: 85%; height: 85%; }
    .grid-num { position: absolute; top: 1px; left: 3px; font-size: 0.65rem; font-weight: bold; }
    
    #drawCanvas { border: 2px solid #000; border-radius: 8px; background: #fff; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }
    
    /* 4자리 코드 스타일 */
    .peer-box { background: #f8fafc; border: 2px solid #000; border-radius: 8px; padding: 10px; font-size: 0.85rem; }
    .code-display { font-size: 1.2rem; font-weight: bold; color: #2563eb; letter-spacing: 2px; }

    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .top-status-bar { background: #fff; border: 3px solid #000; border-radius: 10px; padding: 8px 12px; font-weight: bold; font-size: 1.1rem; }
    .chat-container { flex: 1; background: #fff; border: 3px solid #000; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; }
    .chat-title { font-size: 1.2rem; font-weight: 800; margin: 0 0 10px 0; }
    
    .chat-list { flex: 1; overflow-y: auto; height: 320px; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
    .chat-msg { display: flex; align-items: flex-start; gap: 8px; }
    .chat-msg.self { flex-direction: row-reverse; }
    
    .msg-avatar {
      width: 40px; height: 40px; background: #e0f2fe; border: 2px solid #000;
      border-radius: 10px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .msg-avatar svg, .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg-body { max-width: 75%; }
    .msg-user { font-size: 0.8rem; font-weight: bold; margin-bottom: 2px; }
    .chat-msg.self .msg-user { text-align: right; }
    
    .msg-bubble { border: 2px solid #000; border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; background: #e2e8f0; }
    .chat-msg.other-1 .msg-bubble { background: #ffedd5; }
    .chat-msg.self .msg-bubble { background: #bae6fd; }
    
    .chat-input-row { display: flex; gap: 8px; margin-top: 10px; }

    @media (max-width: 768px) { .main-wrapper { flex-direction: column; } }
  </style>
</head>
<body>

<div class="main-wrapper">
  <!-- 좌측 패널 -->
  <div class="left-panel">
    <h2 class="panel-title">캐릭터 선택</h2>

    <div class="preview-container">
      <div class="big-avatar-box" id="mainPreviewBox"></div>
      <div class="preview-controls">
        <div>
          <div class="input-label">캐릭터 이름</div>
          <input type="text" id="nameInput" class="custom-input" value="마시멜로">
        </div>
        <button class="btn-blue" onclick="saveName()">이름 저장</button>
      </div>
    </div>

    <div class="nav-btns">
      <button class="btn-gray" onclick="navCharacter(-1)">이전</button>
      <button class="btn-blue" style="flex:1; padding:6px;" onclick="navCharacter(1)">다음</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="setTab('grid')">기본 캐릭터</button>
      <button class="tab-btn" onclick="setTab('draw')">직접 그리기</button>
      <button class="tab-btn" onclick="setTab('upload')">사진 업로드</button>
      <button class="tab-btn" onclick="setTab('peer')">친구 연동</button>
    </div>

    <!-- 1. 그리드 -->
    <div id="tab-grid" class="tab-content active">
      <div class="grid-box" id="characterGrid"></div>
    </div>

    <!-- 2. 그리기 -->
    <div id="tab-draw" class="tab-content">
      <canvas id="drawCanvas" width="130" height="130"></canvas>
      <div style="display:flex; gap:4px; margin-top:6px; justify-content:center;">
        <input type="color" id="penColor" value="#000000">
        <button class="btn-gray" onclick="clearCanvas()">지우기</button>
        <button class="btn-blue" style="padding:2px 8px; font-size:0.8rem;" onclick="applyDrawing()">적용</button>
      </div>
    </div>

    <!-- 3. 사진 업로드 -->
    <div id="tab-upload" class="tab-content">
      <input type="file" accept="image/*" class="custom-input" onchange="uploadImage(event)">
    </div>

    <!-- 4. 친구 연동 (4자리 숫자 코드 반영) -->
    <div id="tab-peer" class="tab-content">
      <div class="peer-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>내 4자리 접속 코드: <span id="myPeerId" class="code-display">----</span></div>
          <button class="btn-blue" style="padding:4px 8px; font-size:0.75rem;" onclick="generate4DigitCode()">코드 생성</button>
        </div>
        <div style="display:flex; gap:4px; margin-top:8px;">
          <input type="text" id="friendIdInput" class="custom-input" placeholder="친구 4자리 숫자 입력" maxlength="4" style="padding:6px;">
          <button class="btn-blue" style="padding:4px 12px; font-size:0.85rem;" onclick="connectFriend()">연결</button>
        </div>
        <div id="connStatus" style="color:#16a34a; font-weight:bold; margin-top:6px;"></div>
      </div>
    </div>
  </div>

  <!-- 우측 패널 -->
  <div class="right-panel">
    <div class="top-status-bar">
      선택된 캐릭터: <span id="topCharName">마시멜로</span>
    </div>

    <div class="chat-container">
      <h3 class="chat-title">실시간 채팅</h3>
      <div class="chat-list" id="chatList"></div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" class="custom-input" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button class="btn-blue" style="width:70px;" onclick="sendMsg()">전송</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SVG_LIST = [
    `<svg viewBox="0 0 100 100"><ellipse cx="38" cy="22" rx="8" ry="18" fill="#fff" stroke="#1e293b" stroke-width="4"/><ellipse cx="62" cy="22" rx="8" ry="18" fill="#fff" stroke="#1e293b" stroke-width="4"/><path d="M 22,58 C 20,38 80,38 78,58 C 80,78 20,78 22,58 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/><circle cx="40" cy="54" r="3.5" fill="#1e293b"/><circle cx="60" cy="54" r="3.5" fill="#1e293b"/><path d="M 45 62 Q 50 67 55 62" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="32" cy="58" r="4.5" fill="#f472b6"/><circle cx="68" cy="58" r="4.5" fill="#f472b6"/></svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="28" cy="32" r="10" fill="#1e293b"/><circle cx="72" cy="32" r="10" fill="#1e293b"/><path d="M 20,58 C 18,38 82,38 80,58 C 82,80 18,80 20,58 Z" fill="#fff" stroke="#1e293b" stroke-width="4"/><ellipse cx="38" cy="52" rx="7" ry="9" fill="#1e293b"/><ellipse cx="62" cy="52" rx="7" ry="9" fill="#1e293b"/><ellipse cx="38" cy="51" rx="2" ry="3" fill="#fff"/><ellipse cx="62" cy="51" rx="2" ry="3" fill="#fff"/><path d="M 46 63 Q 50 66 54 63" stroke="#1e293b" stroke-width="3" fill="none"/></svg>`,
    `<svg viewBox="0 0 100 100"><path d="M 20,58 C 18,35 82,35 80,58 C 82,80 18,80 20,58 Z" fill="#f97316" stroke="#1e293b" stroke-width="4"/><path d="M 30,62 C 28,45 72,45 70,62 C 72,78 28,78 30,62 Z" fill="#ffedd5"/><circle cx="40" cy="52" r="3.5" fill="#1e293b"/><circle cx="60" cy="52" r="3.5" fill="#1e293b"/><path d="M 46 60 Q 50 64 54 60" stroke="#1e293b" stroke-width="3" fill="none"/><circle cx="32" cy="58" r="5" fill="#fca5a5"/><circle cx="68" cy="58" r="5" fill="#fca5a5"/></svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="28" cy="30" r="9" fill="#334155" stroke="#1e293b" stroke-width="3"/><circle cx="72" cy="30" r="9" fill="#334155" stroke="#1e293b" stroke-width="3"/><path d="M 20,58 C 18,36 82,36 80,58 C 82,80 18,80 20,58 Z" fill="#334155" stroke="#1e293b" stroke-width="4"/><ellipse cx="50" cy="62" rx="14" ry="10" fill="#f8fafc"/><circle cx="40" cy="50" r="3" fill="#1e293b"/><circle cx="60" cy="50" r="3" fill="#1e293b"/><ellipse cx="50" cy="58" rx="4" ry="3" fill="#1e293b"/><circle cx="32" cy="56" r="4.5" fill="#f43f5e"/><circle cx="68" cy="56" r="4.5" fill="#f43f5e"/><rect x="58" y="66" width="14" height="10" rx="3" fill="#fff" stroke="#1e293b" stroke-width="2"/></svg>`
  ];

  let currentIndex = 0;
  let currentAvatar = { type: 'svg', data: SVG_LIST[0] };
  let charName = "마시멜로";
  let peer = null, conn = null;

  window.onload = () => {
    renderGrid();
    selectCharacter(0);
    initCanvas();
    generate4DigitCode(); // 자동으로 4자리 숫자 생성하여 접속
  };

  function renderGrid() {
    const grid = document.getElementById('characterGrid');
    grid.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const item = document.createElement('div');
      item.className = `grid-item ${i === currentIndex ? 'active' : ''}`;
      item.onclick = () => selectCharacter(i);
      item.innerHTML = `<span class="grid-num">${i + 1}</span>${SVG_LIST[i % SVG_LIST.length]}`;
      grid.appendChild(item);
    }
  }

  function selectCharacter(index) {
    currentIndex = index;
    currentAvatar = { type: 'svg', data: SVG_LIST[index % SVG_LIST.length] };
    document.querySelectorAll('.grid-item').forEach((el, idx) => el.classList.toggle('active', idx === index));
    updatePreview();
  }

  function navCharacter(dir) {
    let next = (currentIndex + dir + 30) % 30;
    selectCharacter(next);
  }

  function updatePreview() {
    const box = document.getElementById('mainPreviewBox');
    box.innerHTML = currentAvatar.type === 'svg' ? currentAvatar.data : `<img src="${currentAvatar.data}">`;
  }

  function saveName() {
    const val = document.getElementById('nameInput').value.trim();
    if (val) {
      charName = val;
      document.getElementById('topCharName').innerText = charName;
    }
  }

  function setTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  // 4자리 숫자 코드 연동 핵심 로직
  function generate4DigitCode() {
    if (peer) peer.destroy(); // 기존 연결 해제

    // 1000 ~ 9999 사이의 랜덤 4자리 숫자 생성
    const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
    
    // PeerJS를 해당 4자리 ID로 초기화
    peer = new Peer(randomCode);

    peer.on('open', id => {
      document.getElementById('myPeerId').innerText = id;
    });

    // 만약 선점된 숫자라면 재시도
    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        generate4DigitCode(); // 다른 숫자로 자동 재시도
      }
    });

    peer.on('connection', c => {
      conn = c;
      listenChat();
    });
  }

  function connectFriend() {
    const friendId = document.getElementById('friendIdInput').value.trim();
    if (friendId.length !== 4) return alert("4자리 숫자를 입력하세요!");
    
    conn = peer.connect(friendId);
    listenChat();
  }

  function listenChat() {
    conn.on('open', () => document.getElementById('connStatus').innerText = "🟢 친구와 연결 완료!");
    conn.on('data', data => addMessage(data.user, data.avatar, data.text, false));
  }

  // 그리기 기능
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  function initCanvas() {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    canvas.addEventListener('mousedown', () => isDrawing = true);
    canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', draw);
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = document.getElementById('penColor').value;
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke(); ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
  }

  function clearCanvas() { ctx.fillRect(0, 0, canvas.width, canvas.height); }
  function applyDrawing() { currentAvatar = { type: 'img', data: canvas.toDataURL() }; updatePreview(); }

  function uploadImage(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => { currentAvatar = { type: 'img', data: evt.target.result }; updatePreview(); };
      reader.readAsDataURL(file);
    }
  }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(charName, currentAvatar, text, true);
    if (conn && conn.open) conn.send({ user: charName, avatar: currentAvatar, text: text });
    input.value = '';
  }

  function addMessage(user, avatar, text, isSelf) {
    const list = document.getElementById('chatList');
    const msg = document.createElement('div');
    msg.className = `chat-msg ${isSelf ? 'self' : 'other-1'}`;
    const avatarHtml = avatar.type === 'svg' ? avatar.data : `<img src="${avatar.data}">`;

    msg.innerHTML = `
      <div class="msg-avatar">${avatarHtml}</div>
      <div class="msg-body">
        <div class="msg-user">${user}</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      </div>
    `;
    list.appendChild(msg);
    list.scrollTop = list.scrollHeight;
  }

  function escapeHtml(str) { return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
</script>

</body>
</html>
