<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동글동글 귀여운 채팅룸</title>
  <style>
    :root {
      --bg-color: #e0f2fe;
      --card-bg: #ffffff;
      --border-color: #1e293b;
      --primary-color: #3b82f6;
      --accent-color: #ffedd5;
    }

    * {
      box-sizing: border-box;
      font-family: 'Single Day', 'Gothic A1', 'Nanum Gothic', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--border-color);
    }

    /* Left Panel: Character Selection */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px dashed #cbd5e1;
      padding-right: 20px;
    }

    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.5rem;
      text-align: center;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 8px;
    }

    .selected-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fafc;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .selected-preview svg {
      width: 80px;
      height: 80px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding: 5px;
    }

    .char-card {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.15s ease;
    }

    .char-card:hover {
      transform: translateY(-2px);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .char-card.active {
      background-color: var(--accent-color);
      border-width: 3px;
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .char-card svg {
      width: 45px;
      height: 45px;
    }

    .char-name {
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .input-group {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
      font-size: 0.9rem;
    }

    input[type="text"] {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: var(--primary-color);
      color: white;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-color);
      transition: all 0.1s;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    /* Right Panel: Chat Log */
    .right-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }

    .chat-box {
      flex: 1;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      background: #f1f5f9;
      padding: 12px;
      overflow-y: auto;
      height: 350px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .chat-avatar svg {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border-color);
      border-radius: 50%;
      background: white;
    }

    .chat-content {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      max-width: 80%;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
    }

    .chat-user {
      font-size: 0.8rem;
      font-weight: bold;
      color: #64748b;
      margin-bottom: 2px;
    }

    .chat-text {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .chat-input-area input {
      flex: 1;
    }

    /* Mobile Responsive */
    @media (max-width: 640px) {
      .container {
        flex-direction: column;
      }
      .left-panel {
        border-right: none;
        border-bottom: 2px dashed #cbd5e1;
        padding-right: 0;
        padding-bottom: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 캐릭터 선택 패널 -->
  <div class="left-panel">
    <h2>캐릭터 선택</h2>
    
    <div class="selected-preview">
      <div id="previewAvatar"></div>
      <div id="previewName" style="font-weight: bold; margin-top: 6px;">선택된 캐릭터</div>
    </div>

    <div class="grid-container" id="characterGrid">
      <!-- 캐릭터들이 JS로 동적 생성됩니다 -->
    </div>

    <div class="input-group">
      <label for="nicknameInput">사용자 이름</label>
      <input type="text" id="nicknameInput" value="귀여운탐험가_7">
      <button onclick="updateProfile()">프로필 적용</button>
    </div>
  </div>

  <!-- 채팅 로그 패널 -->
  <div class="right-panel">
    <h2>채팅 로그</h2>
    
    <div class="chat-box" id="chatBox">
      <!-- 기본 샘플 메시지 -->
      <div class="chat-item">
        <div class="chat-avatar" id="sampleAvatar1"></div>
        <div class="chat-content">
          <div class="chat-user">사과_팬</div>
          <div class="chat-text">안녕하세요! 아바타가 너무 귀여워요!</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="chat-avatar" id="sampleAvatar2"></div>
        <div class="chat-content">
          <div class="chat-user">햄스터사랑</div>
          <div class="chat-text">우와! 전 햄스터로 골랐어요! 🐹</div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="chatMessageInput" placeholder="메시지 입력..." onkeypress="handleKeyPress(event)">
      <button onclick="sendChatMessage()">전송</button>
    </div>
  </div>
</div>

<script>
  // SVG 캐릭터 데이터
  const characters = [
    {
      id: 1,
      name: "사과곰",
      svg: `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="35" fill="#ff4d4d" stroke="#1e293b" stroke-width="4"/>
        <path d="M50 20 Q55 10 60 15" stroke="#1e293b" stroke-width="4" fill="none"/>
        <ellipse cx="40" cy="50" rx="4" ry="6" fill="#1e293b"/>
        <ellipse cx="60" cy="50" rx="4" ry="6" fill="#1e293b"/>
        <path d="M46 58 Q50 63 54 58" stroke="#1e293b" stroke-width="3" fill="none"/>
        <circle cx="33" cy="56" r="5" fill="#ffb3b3"/>
        <circle cx="67" cy="56" r="5" fill="#ffb3b3"/>
      </svg>`
    },
    {
      id: 2,
      name: "바나나원숭이",
      svg: `<svg viewBox="0 0 100 100">
        <path d="M20 70 Q50 15 80 70 Q50 95 20 70 Z" fill="#ffe135" stroke="#1e293b" stroke-width="4"/>
        <circle cx="50" cy="55" r="22" fill="#fff3a0" stroke="#1e293b" stroke-width="3"/>
        <circle cx="43" cy="52" r="3" fill="#1e293b"/>
        <circle cx="57" cy="52" r="3" fill="#1e293b"/>
        <path d="M46 60 Q50 64 54 60" stroke="#1e293b" stroke-width="3" fill="none"/>
      </svg>`
    },
    {
      id: 3,
      name: "햄스터",
      svg: `<svg viewBox="0 0 100 100">
        <circle cx="50" cy="55" r="32" fill="#f97316" stroke="#1e293b" stroke-width="4"/>
        <circle cx="50" cy="58" r="22" fill="#ffedd5"/>
        <ellipse cx="40" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <ellipse cx="60" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <path d="M47 56 Q50 60 53 56" stroke="#1e293b" stroke-width="3" fill="none"/>
        <circle cx="34" cy="56" r="6" fill="#fca5a5"/>
        <circle cx="66" cy="56" r="6" fill="#fca5a5"/>
      </svg>`
    },
    {
      id: 4,
      name: "귀여운 흑곰", // 4번: 요구사항에 부합하는 차 마시는 흑곰 캐릭터
      svg: `<svg viewBox="0 0 100 100">
        <circle cx="30" cy="30" r="10" fill="#334155" stroke="#1e293b" stroke-width="4"/>
        <circle cx="70" cy="30" r="10" fill="#334155" stroke="#1e293b" stroke-width="4"/>
        <circle cx="50" cy="55" r="34" fill="#334155" stroke="#1e293b" stroke-width="4"/>
        <ellipse cx="50" cy="62" rx="16" ry="12" fill="#f8fafc"/>
        <ellipse cx="40" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <ellipse cx="60" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <ellipse cx="50" cy="58" rx="4" ry="3" fill="#1e293b"/>
        <circle cx="33" cy="56" r="5" fill="#f43f5e"/>
        <circle cx="67" cy="56" r="5" fill="#f43f5e"/>
        <!-- 찻잔 -->
        <rect x="58" y="68" width="16" height="12" rx="3" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
        <path d="M74 71 Q78 74 74 77" stroke="#1e293b" stroke-width="3" fill="none"/>
      </svg>`
    },
    {
      id: 5,
      name: "토끼",
      svg: `<svg viewBox="0 0 100 100">
        <ellipse cx="40" cy="25" rx="8" ry="20" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
        <ellipse cx="60" cy="25" rx="8" ry="20" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
        <circle cx="50" cy="60" r="30" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
        <circle cx="42" cy="55" r="3.5" fill="#1e293b"/>
        <circle cx="58" cy="55" r="3.5" fill="#1e293b"/>
        <path d="M47 62 Q50 66 53 62" stroke="#1e293b" stroke-width="3" fill="none"/>
        <circle cx="34" cy="60" r="5" fill="#f472b6"/>
        <circle cx="66" cy="60" r="5" fill="#f472b6"/>
      </svg>`
    },
    {
      id: 6,
      name: "강아지",
      svg: `<svg viewBox="0 0 100 100">
        <ellipse cx="22" cy="50" rx="10" ry="18" fill="#d97706" stroke="#1e293b" stroke-width="4"/>
        <ellipse cx="78" cy="50" rx="10" ry="18" fill="#d97706" stroke="#1e293b" stroke-width="4"/>
        <circle cx="50" cy="55" r="32" fill="#fef3c7" stroke="#1e293b" stroke-width="4"/>
        <circle cx="40" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <circle cx="60" cy="50" rx="3" ry="5" fill="#1e293b"/>
        <ellipse cx="50" cy="58" rx="5" ry="4" fill="#1e293b"/>
        <path d="M50 62 L50 67" stroke="#1e293b" stroke-width="3"/>
      </svg>`
    }
  ];

  let selectedCharacter = characters[3]; // 기본으로 4번 흑곰 선택
  let username = "귀여운탐험가_7";

  // 초기화 함수
  function init() {
    const grid = document.getElementById('characterGrid');
    grid.innerHTML = '';

    characters.forEach(char => {
      const card = document.createElement('div');
      card.className = `char-card ${char.id === selectedCharacter.id ? 'active' : ''}`;
      card.onclick = () => selectCharacter(char);
      card.innerHTML = `
        ${char.svg}
        <div class="char-name">${char.name}</div>
      `;
      grid.appendChild(card);
    });

    // 샘플 프로필 설정
    document.getElementById('sampleAvatar1').innerHTML = characters[0].svg;
    document.getElementById('sampleAvatar2').innerHTML = characters[2].svg;

    updatePreview();
  }

  function selectCharacter(char) {
    selectedCharacter = char;
    
    // 카드 활성화 표시 전환
    document.querySelectorAll('.char-card').forEach((card, index) => {
      if (characters[index].id === char.id) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });

    updatePreview();
  }

  function updatePreview() {
    document.getElementById('previewAvatar').innerHTML = selectedCharacter.svg;
    document.getElementById('previewName').innerText = selectedCharacter.name;
  }

  function updateProfile() {
    const input = document.getElementById('nicknameInput').value.trim();
    if (input) {
      username = input;
      alert(`프로필이 업데이트되었습니다! 이름: ${username}`);
    }
  }

  function sendChatMessage() {
    const msgInput = document.getElementById('chatMessageInput');
    const text = msgInput.value.trim();

    if (!text) return;

    const chatBox = document.getElementById('chatBox');
    
    // 새로운 메시지 요소 생성
    const chatItem = document.createElement('div');
    chatItem.className = 'chat-item';
    chatItem.innerHTML = `
      <div class="chat-avatar">${selectedCharacter.svg}</div>
      <div class="chat-content">
        <div class="chat-user">${username}</div>
        <div class="chat-text">${escapeHtml(text)}</div>
      </div>
    `;

    chatBox.appendChild(chatItem);
    msgInput.value = '';
    
    // 자동 스크롤 하단 이동
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendChatMessage();
    }
  }

  function escapeHtml(string) {
    return String(string).replace(/[&<>"']/g, function (s) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[s];
    });
  }

  // 실행 시작
  init();
</script>

</body>
</html>
